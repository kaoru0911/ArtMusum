        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lee2.webp?v=1735003580107"
            data-text="李欽泓（Chinhung Lee），1963年生於台灣苗栗，受學院薫陶，擅長水墨及水彩，尤以水彩繪畫卓越。其畫作以如玉石般溫潤的「玉質化色彩」及獨特技法「爆破寫生」聞名，被譽為「色彩之王」。他曾獲邀參加威尼斯雙年展邀請展（與新墨派一起），榮任合鄉美術館永久駐館藝術家，並挑戰世界最長的蓮花寫生畫作。他經常將易經、老莊哲學融入作品中，讓人們在欣賞畫作時猶如展開一場心靈饗宴。<br>
        <br> Chinhung Lee, born in 1963 in Miaoli, Taiwan, is a master of
        ink and watercolor painting, particularly known for his
        exceptional skill in watercolor. His works are celebrated for
        their distinctive &quot;jade-like colors&quot; and his unique &quot;explosive
        sketching&quot; technique, which have earned him the title &quot;King of
        Color.&quot; 
        Twice Invited to Display at the Venice Biennale International Art Exhibition</h3>
        <br>Lee has been invited to exhibit his work in the Venice
        Biennale International Art Exhibition (alongside the works of
        New Ink Doctrine) and has served as the permanent artist-in-
        residence at the He Hsiang Art Museum. He has also taken on
        the ambitious project of creating the world's longest lotus-
        themed sketch. Lee often integrates the philosophies of the
        Book of Changes (I Ching), Laozi, and Zhuangzi into his works,
        offering viewers a profound spiritual experience as they
        appreciate his art." position="-49 34.335 -135" scale="31.78569 28.52144 60.25739" rotation="0 90 0">
        </a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"
            position="94.84843 100 -20.75886" rotation="-45 0 180"></a-entity>
        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lu2.webp?v=1735003845491"
            data-text="盧崇道（Dao Lu），1954年生於越南，現居美國，師承嶺南畫派大師梁少航，擅長描繪花鳥和走獸，水墨筆觸活潑自然。
                  他的作品融合國畫技法與西洋色彩，色彩鮮明，構圖獨特。移居美國前，他已是越南知名畫家，畫作一出即售罄。
                  他多次在中、美、越三國舉辦個展及參加國際聯展，被選為北美華人百大書畫家，現為美國東方藝術會和國際美術家協會會員。
                  嶺南畫派以顛覆傳統並融合中西畫風著稱，盧崇道繼承此精神，創作出值得收藏的佳作。
                  <br><br>
                  Dao Lu, born in Vietnam in 1954 and currently residing in the United States, 
                  is a distinguished artist who studied under Lingnan School master Liang Shaohang.
                  He excels in depicting flowers, birds, and animals with vibrant and natural ink brush strokes.
                  His works merge traditional Chinese painting techniques with Western color schemes,
                  resulting in vivid colors and unique compositions. Before moving to the United States,
                  he was already a renowned painter in Vietnam, with his works selling out immediately upon release.
                  He has held numerous solo exhibitions and participated in international joint exhibitions in China,
                  the United States, and Vietnam. Recognized as one of the top 100 Chinese calligraphers and painters in North America,
                  he is a member of the Oriental Art Association of America and the Global Artists Association U.S.A.
                  The Lingnan School is known for its innovative approach that blends traditional and Western painting styles,
                  and Dao Lu continues this legacy, creating works that are highly collectible."
            position="46.524 35 -90" scale="33.39266 27 68.77377" rotation="0 -90 0"></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-11.webp?v=1735127802848"
            data-text="<h3>禪定蓮開<br>Zen Lotus Blooming</h3>
                   <h5>畫家：李欽泓｜尺寸: 110x80 cm｜材質：水彩｜系列：蓮花寫生｜非賣品.可標售</h5>
                   畫家以中國書法強而有力的筆觸，一筆豪氣地勾勒出饒富禪味與修行意境的線條。畫作傳達出修行人的境界——在生活中，無論處於順境或逆境，動或靜、閒或忙，只要能清楚覺知，看破真理與真相，便能不被外在事物所影響，心中自然綻放出一朵出污泥而不染的蓮花。<br><br>
                   With powerful brushstrokes reminiscent of Chinese calligraphy, 
                   the artist boldly outlines lines imbued with Zen and the essence of self-cultivation.
                   The painting captures the state of mind of a self-cultivation practitioner—whether in favorable or adverse circumstances, 
                   in motion or stillness, in leisure or busyness, one perceives truth and reality clearly, remaining unaffected by external matters. 
                   As a result, a lotus flower blooms naturally in the heart, unsullied by the mud from which it grows." position="356.55173 35 69.52121" scale="42.994 34.718 85.538" rotation="0 180 0"></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"
            position="327.45132 100 17.42011" rotation="-45 -180 180"></a-entity>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-20.png?v=1735128191736" data-text="<h3>宇宙之蓮 (第2號)<br>The Lotus Flower of the Universe (No. 2) </h3>
                   <h5>畫家：李欽泓｜編號: L20240620-01-152x102｜尺寸: 152x102 cm｜材質：水彩｜系列：蓮花寫生｜非賣品.可標售</h5>
                  濃墨蘸筆，懸空畫作，滴答落下「屋漏痕」的自然斑點痕跡。
                  小自電子、質子、中子，大至月亮、地球、銀河系…宇宙間相互牽引，盡皆環繞「氣韻生動」的蓮花心湖。展現中國水墨畫的至高境界！<br><br>
                  With a brush dipped in thick ink hovering above the canvas, natural specks form as the ink drips down like &quotmarks of a leaking roof.&quot 
                  From the smallest particles—electrons, protons, and neutrons—to the moon, Earth, and galaxies, everything is interconnected, 
                   revolving around the vivid lake of the lotus flower—a lake of pure heart, brimming with energy and fragrance.
                   This artwork embodies the highest essence of Chinese ink painting!" position="297.65061 35 69.5"
            scale="42.99423 34.718 85.538" rotation="0 180 0"></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.5; type: spot"
            position="199.97591 100 17.42" rotation="-45 -180 180"></a-entity>
        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-21.png?v=1735128236319"
            data-text="<h3>洪荒之始<br>The Beginning of Time</h3>
                   <h5>畫家:李欽泓｜編號: L20240813-08-320x110｜尺寸: 320x110 cm｜材質：水彩｜系列：蓮花寫生｜非賣品.可標售</h5>
                  東方哲學思想貫穿當代藝術精髓！<br>
                  色墨與留白、桃紅與翠綠……東方陰陽的用色交織行動繪畫的前衛衝擊，彷彿聽見「砰磞、砰磞」的巨響，如盤古開天闢地的磅礡力道與能量，縱橫古今，超越時空，至今仍在畫中流動不息。
                  這是一幅具時間感、空間感、力度感、律動感與聲音感的絕對藝術創作。<br><br>
                  Eastern philosophy permeates the essence of contemporary art! The interplay of ink and blank space, peach pink and emerald green . . . The colors of Eastern yin and yang collide with the avant-garde energy of action painting, as if one can hear the thunderous “Boom! Boom! Boom!” of Pangu, the primitive giant in Eastern mythology, separating the Sky and the Earth. This powerful fusion bridges the ancient and modern, transcending time and space, as the energy continues to flow endlessly within the artwork.
                  This is a truly remarkable artistic creation, filled with a profound sense of time, space, energy, rhythm, and sound." position="210 35 69.5" scale="100.13349 35.85091 85.538"
            rotation="0 180 0"></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"
            position="95.85798 100 17.42011" rotation="-45 -180 180"></a-entity>
        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lee8.webp?v=1735003790980"
            data-text="<h3>蓮花寫生系列<br>Lotus Sketch Series</h3><br>
                   李欽泓結合東方水墨、透明水彩和書法筆觸，創作了比莫內「睡蓮-池中之雲」更長幅的蓮花寫生作品，被評論家形容為「英雄式掛毯」
                   。香港藝評人李華川稱：「畫魔出現了！」李欽泓的蓮花寫生堪比世界級美術館的珍藏之作。 
                   他使用水瓢、拖把與畫筆凌空作畫，利用近5000張Arches紙材，歷時十個月，描繪蓮花四季變化，展示了「爆破寫生」技法、「玉質化」色彩和國畫的留白藝術。2014年，為侍奉母親而停筆十年的李欽泓重新拾筆，每天清晨五點到蓮花池寫生捕捉最美瞬間。 作畫前，他會靜心打坐，結合內心修為、文化內涵、詩意和筆韻節奏，繪製出一系列精湛的蓮花作品，饒富禪意與修行人的思維。<br><br>
                   Chinhung Lee masterfully blended Eastern ink painting,
                  transparent watercolor, and calligraphic strokes to create lotus
                  sketches even longer than Monet's  &amp;quotReflections of Clouds on the
                  Water-Lily Pond. &amp;quotCritics have hailed these works as  &amp;quotheroic
                  tapestries, &amp;quotwith Hong Kong art critic Li Hua-Chuan calling him a
                   &amp;quotpainting wizard.&quot; Lee's lotus sketches are deemed worthy of
                  display in the world's top art museums.
                  Using water scoops, mops, and brushes, Lee painted in the
                  air, using nearly 5,000 sheets of Arches paper over ten months
                  to depict the seasonal changes of lotus flowers. This series
                  showcased his  &amp;quotexplosive sketching&quot; technique, jade-like colors,
                  and the reserved white space characteristic of traditional
                  Chinese painting.
                  In 2014, after a ten-year hiatus to care for his mother, Lee
                  resumed his artistic journey. Each morning at five o'clock, he
                  sketched at the lotus pond to capture its most beautiful
                  moments. Before painting, he would meditate to quiet his mind,
                  blending inner cultivation, cultural richness, poetic expression,
                  and rhythmic brush strokes to create a series of exquisite lotus
                  paintings, rich in Zen and the contemplative thoughts of a self-
                  cultivation practitioner." position="105 35 69.5" scale="98.94632 44.058 85.538"
            rotation="0 180 0"></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"
            position="-113.68187 100 12.16921" rotation="-45 180 180"></a-entity>
        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-9.webp?v=1735127779517" data-text="<h3>霹靂圖騰<br>Thunderbolt Totem</h3>
                   <h5>畫家：李欽泓｜編號: L2024031801-220x80｜尺寸: 220x80 cm｜材質：水彩</h5>
                   這幅前衛藝術作品描繪了「大爆炸」後宇宙生成與生命誕生的意象，洋溢著幸福感。
                   畫中紅色線條隱隱相連，象徵著緣分，隨時間流逝，生命個體因七情六慾，逐漸忘記了本源。
                   畫家反思「人從何而來，又將往何處去？」將自己修行過程比喻為《西遊記》中孫悟空的旅程，經無數挫折後找到生命歸原之道。
                   作品由四張對開畫紙組成，最右邊一張左下角有一道粗獷黑藍色的縱線，象徵孫悟空戰至宇宙邊際，留下「到此一遊」印記，因此名為「霹靂圖騰」。
                   <br><br>
                   This avant-garde artwork captures the imagery of the universe's formation and the birth of life
                   after the “Big Bang,” radiating a warm and joyous feeling. The connected red lines symbolize
                   fate, yet as time passes, individuals gradually forget their origin due to emotions and desires.
                   The artist contemplates the questions, “Where did we come from, and where are we going?” He
                   metaphorically compares his spiritual journey to that of the Monkey King from the Eastern
                   mythological novel “Journey to the West.” Like the Monkey King, who endured countless
                   setbacks and trials before finding the way back to the origin of life, the artist reflects on his own
                   path. This painting consists of four panels. In the lower left corner of the far right panel, a thick black
                   vertical line symbolizes the Monkey King's journey to the edge of the universe, leaving a mark of
                   “been here.” Thus, the painting is titled “Thunderbolt Totem.”" position="-95.21434 35 69.5"
            scale="81.331 28.073 54.401" rotation="0 180 0"></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/3d50dbd3-9caa-4b7c-aad8-b0e6ec04f9df/lifu-8.webp?v=1735123101554"
            data-text="<h3>修行之門<br>The Gate of Self-Cultivation</h3>
                   <h5>畫家：李欽泓｜編號: L20240620-02-88x120｜尺寸：88x120 cm｜材質：壓克力彩</h5>
                   這幅畫作是李欽泓的《霹靂圖騰》系列中的一幅抽象傑作，探索了修行的境界及意義。
                   畫中白色的壓克力彩彷彿是一扇修行之門，門內的世界由桃紅、橙色、紅色和黑色構成，充滿了精彩和奧妙。
                   畫家以象徵性的黑色筆觸，記錄了他從門外混沌世界走入門內精彩世界的過程，這些筆觸如同他到此一遊的圖騰印記。
                   畫作予人衝擊的感受，但是每個筆觸和色彩都互相平衡，並展示了豐富的層次和深邃的內涵，是一件值得細細品味和探索的藝術珍品。
                   <br><br>
                   This painting is an abstract masterpiece from Chinhung Lee's ”Thunderbolt Totem” series, 
                   delving into the realm and significance of self-cultivation. White acrylic paint forms a gateway to self-cultivation.
                   Within this gate, vibrant hues of pink, orange, red, and black create a world full of wonder and mystery.
                   The artist uses symbolic black brushstrokes to chronicle his journey from the chaotic world outside
                   to the splendid world within, with these strokes serving as totemic marks of his passage.
                   The painting delivers a powerful impact, yet every stroke and color harmonizes, displaying rich layers
                   and profound depth. This piece is an artistic treasure worthy of careful appreciation and exploration." position="-157.08565 35 69.5" scale="25.16 32.104 41.223" rotation="0 180 0"></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lee7.webp?v=1735003762694"
            data-text="<h3>「霹靂繪畫」系列<br>“THE THUNDERBOLT PAINTING” SERIES</h3>
                   李欽泓一直通過繪畫追尋永恆，探索宇宙的奧秘和生命的意義，思考人類從何而來，又將往何處去。
                   偶然間，他讀到《霍金傳》及《時間簡史》等科普書籍，了解到科學家如何探索宇宙。
                   有一派理論主張宇宙經由一場大爆炸（Big Bang）而誕生，這與東方易經所云的「一氣生萬物」不謀而合。
                   大爆炸（Big Bang）在中文美化翻譯為「大霹靂」，啟發了李欽泓創作「霹靂繪畫」系列，探索宇宙的起源，追尋生命回歸的本源。
                  <br><br>
                   Chinhung Lee dedicated his artistic life to the pursuit of eternity, 
                   employing his brushstrokes to unravel the mysteries of the universe, 
                   pondering where humanity comes from and where it is heading.
                   A chance encounter with popular science books such as “Stephen Hawking's Universe” and ”A Brief History of Time” sparked a profound shift in Chinhung’s artistic perspective. 
                   He became captivated by the scientific approach to understanding the universe, 
                   particularly the concept of the Big Bang, which coincides with the Eastern philosophical concept of ”a single source of energy giving birth to all things,” 
                   as described in the I Ching (Book of Changes).
                   Therefore, Chinhung named the Big Bang as the ”Great Thunderbolt,” 
                   initiating ”The Thunderbolt Painting” series to explore the mysteries of cosmic origins and the essence of life itself."
            position="-203.56914 35 69.5" scale="62.814 54.053 85.538" rotation="0 180 0"></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"

        <a-image class="clickable"

        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lee6.webp?v=1735003727761"
            data-text="<h3>爆破寫生 全球第一人<br>Explosive Sketching: The World's First</h3>
                   畫作是畫家的身份證，每位名留青史的畫家都有獨特的創意！「爆破寫生」是李欽泓獨創的技法。
                   在他眼中，每個景物都是靈感來源。當風景映入眼簾，觸動瞬間，他立即將顏料凌空投擲到畫紙上，創作便開始。
                   顏料透過爆破在紙上產生能量，再以噴水或灑水的方式，使顏料順著水流自然形成基本構圖。
                   他是玩顏料和玩水的專家，每次創作都配合當時溫度和濕度，與大自然共同即席創作。
                   基本構圖成形後，他用書法筆觸快速勾勒景物輪廓，將顏料、畫筆、畫紙與意念結合，呈現出最完美的「心象合一」抽象作品。
                  <br><br>
                   A painting is a painter's identification card; every artist
                  remembered in history has a unique creative approach.
                  &amp;quotExplosive Sketching&quot; is Chinhung Lee's signature technique. For
                  him, every scene is a wellspring of inspiration. When a landscape
                  catches his eye and sparks a moment of inspiration, he
                  immediately throws paint into the air and onto the paper,
                  initiating the creative process. The paint, propelled by the
                  explosion, generates energy on the paper. Then, using sprays or
                  splashes of water, the paint naturally forms a basic composition
                  as it flows.
                  Chinhung Lee is adept at manipulating both paint and water,
                  adjusting each creation to the current temperature and humidity,
                  thus co-creating spontaneously with nature. After the basic
                  composition takes shape, he quickly outlines the scene with
                  calligraphic strokes, blending paint, brush, paper, and intent to
                  present the most perfect &amp;quotunity of mind and image&quot; in his
                  abstract works." position="-358.216 35 69.5" scale="62.814 55 85.538" rotation="0 180 0"></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lee5.webp?v=1735003678672"
            data-text="<h3>畫裡的玉石光彩-玉質化色彩<br>The Jade-like Radiance in Paintings</h3>
                   在華人社會，玉器象徵品德，隨佩戴越久越顯美麗，如同「溫、良、恭、儉、讓」的美德。
                   這是李欽泓追求的「美」。他鑽研如何將玉石的溫潤色彩與光澤呈現在畫作上，稱之為「玉質化色彩」。
                   李欽泓運用水彩的暈染和水洗技巧，展現玉石的晶瑩剔透與層次美感；
                   在油畫和壓克力中，如同切琢雕磨，層層疊加出陶瓷的釉彩色彩。他運用「全光譜」色彩，使層次豐富，並善用「剔白法」使色澤溫潤有質感。色彩交織，豐富精彩。
                   在李欽泓的畫作中，處處可見玉質化色彩，捕捉大自然千變萬化的色彩，是色彩探索的最高境界，絶美的視覺盛宴。
                    <br><br>
                   In Chinese culture, jade symbolizes virtue, growing more
                  beautiful with time and embodying qualities such as gentleness,
                  kindness, respect, frugality, and modesty. This is the essence of
                  the &quotbeauty&quot that Chinhung Lee strives to capture. He has
                  dedicated himself to mastering the presentation of jade's warm
                  colors and luster in his paintings, a technique he refers to as
                  &quotjade-like colors.&quot
                  Chinhung Lee employs watercolor's blending and wash
                  techniques to reveal the translucence and layered beauty of
                  jade. In his oil and acrylic works, he crafts layers of color
                  reminiscent of ceramic glazes, akin to the processes of carving
                  and polishing. He utilizes the full spectrum of colors to achieve
                  rich layers and employs the &quotpolishing paint technique&quot to give
                  the colors a warm and textured feel. The interplay of these
                  hues creates a rich and vibrant effect.

                  In Chinhung Lee's artworks, jade-like colors are omnipresent,
                  capturing the ever-changing hues of nature. This represents the
                  pinnacle of color exploration, offering viewers a stunning visual
                  feast." position="-398.16061 35 -26.181" scale="54.632 47.77215 -15.972" rotation="0 90 0"></a-image>

            src="https://cdn.glitch.global/3d50dbd3-9caa-4b7c-aad8-b0e6ec04f9df/lifu-4.webp?v=1735122981841" data-text="<h3>故鄉<br>Hometown</h3>
                   <h5>畫家：李欽泓｜編號: L2024031522-54x39｜尺寸: 54x39 cm｜材質：水彩｜已蒙收藏</h5>
                   這幅畫是畫家的故鄉。畫家不斷突破畫風，以不透明水彩的技法以及充滿勁道的筆觸，繪畫出油畫般的色彩效果。畫家李焜培曾形容李欽泓的筆觸猶如一位世界級的拳擊手，不斷揮灑，直至筋疲力竭為止。而這正也是李欽泓畫作的每個細節均能讓人感受到生意盎然的原因。
                  <br><br>
                   This painting depicts the artist's hometown. In a continuous exploration of his artistic style, the artist employs opaque watercolor techniques and forceful brushstrokes, achieving an oil painting-like color effect. 
                  Painter Kunpei Lee once described Chinhung’s brushstrokes as those of a world-class boxer, constantly striking until exhaustion. This is precisely why every detail in Chinhung’s paintings exudes vitality.
                  " position="-282 35 -69" scale="33.8288 22.47756 46.06738" rotation=""></a-image>

                   <h5>畫家：李欽泓｜編號: King of Color-03-54x39｜尺寸: 54x39 cm｜材質：水彩｜非賣品</h5>
                   此畫描繪了清晨時分的故鄉景色，畫家對色彩的掌握精湛，將遠、中、近景處理得層次分明。在晨曦初現時，遠處厚實如男人肩膀的山景於薄霧中若隱若現。中景以現代幾何圖形描繪鄉間的屋宇，近景則以鮮明色彩呈現隨風搖曳的花草和樹木的靈動生命力。畫中，鄉下人家煮早餐的裊裊炊煙與縈繞遠山的山嵐和晨曦的雲層交織在一起，展現出空靈的美感。使觀賞者彷彿置身於寧靜的晨曦之中，也能聞到清新空氣的味道，感覺十分享受、舒適，陶醉其中。這幅畫作也被收錄在拜倫評李欽泓為「色彩之王」的經典作品中。
                   <br><br>
                   This painting captures the dawn scenery of the artist's hometown, showcasing his exquisite
                  command of color with distinct layers for the distant, middle, and foregrounds. As dawn breaks,
                  the distant mountains, solid like a man's shoulders, emerge through the thin mist. The middle
                  ground features rural houses depicted in modern geometric shapes, while the foreground
                  bursts with vibrant colors, bringing to life the flowers and trees swaying in the wind. The curling
                  smoke from rural homes cooking breakfast intertwines with the mountain mist and morning
                  clouds, creating an ethereal beauty. Viewers feel immersed in the tranquility of dawn, able to
                  smell the fresh air and feel deeply content and at ease. This painting is included in Byron's
                  critique article. Later, Chinhung Lee was crowned the 'King of Color.'" position="-180 35 -69"
            scale="33.8288 22.47756 46.06738" rotation=""></a-image>
        <a-image class="clickable"
            src="https://cdn.glitch.global/3d50dbd3-9caa-4b7c-aad8-b0e6ec04f9df/lifu-1.webp?v=1735122565788" data-text="<h3>夕陽之頌<br>Ode to the Sunset</h3><br>
                   <h5>畫家：李欽泓｜編號: King of Color-01-54x39｜尺寸: 54x39 cm｜材質：水彩｜非賣品</h5>
                  畫家用水彩描繪故鄉夕陽的絢爛色彩，作品展現了高超的技法，即使不用水洗技法，也能達到水洗的效果。顏料雖已乾，卻仍保有流動而濕潤的質感，展現如玉般溫潤的色澤。評論者拜倫曾說：這幅畫的色彩如同陶瓷的金黃色，連眾神也會對這等美學感到讚嘆。畫家對色彩的精妙掌握，使得景色比實景更加美麗，宛如蓬萊仙境。
                  拜倫將李欽泓封為「色彩之王」，並選擇這幅畫作為評論的封面，因為這幅畫作說明了一切——它無與倫比！水彩顏料的限制已全然消失！這片遠方廣闊的水洗天空成為水彩畫作史上的記憶里程碑。
                  <br>
                  畫家用水彩描繪故鄉夕陽的絢爛色彩，作品展現了高超的技法，即使不用水洗技法，也能達到水洗的效果。顏料雖已乾，卻仍保有流動而濕潤的質感，展現如玉般溫潤的色澤。評論者拜倫曾說：這幅畫的色彩如同陶瓷的金黃色，連眾神也會對這等美學感到讚嘆。畫家對色彩的精妙掌握，使得景色比實景更加美麗，宛如蓬萊仙境。
                  拜倫將李欽泓封為「色彩之王」，並選擇這幅畫作為評論的封面，因為這幅畫作說明了一切——它無與倫比！水彩顏料的限制已全然消失！這片遠方廣闊的水洗天空成為水彩畫作史上的記憶里程碑。
                  <br><br>
                  The artist masterfully uses watercolors to capture the splendid colors of his hometown's sunset,
                  showcasing exceptional technique. Without employing traditional wash methods, he achieves a
                  wash-like effect. The dried pigments retain a flowing, moist quality, with hues that evoke the
                  warmth and smoothness of jade. The artist's skillful use of color transforms the scenery into
                  something more beautiful than reality, resembling a paradise.
                  Byron crowned Chinhung Lee the &quot King of Color&quot and selected this painting as the cover for his
                  critique. He remarked, &quotThe cover painting says everything. This big sky! The limitation of water
                  based has disappeared from my eyes! It serves instead like no other.&quot" position="-134 35 -69"

        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lee3.webp?v=1735003602302"
            data-text="<h3>色彩之王的崛起 李欽泓的藝術傳奇<br>The Rise of the King of Color:
        The Artistic Legend of Chinhung Lee</h3>
        李欽泓一生致力於追求宇宙中最美麗的色彩，尤其對西方印象派的經典色彩情有獨鍾。他深入研究並吸取莫內和波納爾的色彩精華，同時鑽研東方玉器和陶瓷的色澤之美，將各種材質的顏料運用在畫布上，創作出如「玉」般溫潤且層次豐富的色彩，令人驚艷。
        然而，他的才華一度被埋沒在文化沙漠中。家人無法理解他的藝術痴迷，將他送進瘋人院…
        李欽泓忍辱負重，走過了一段傳奇的繪畫人生，直到國際評論家拜倫·蒙哥馬利透過臉書找到他，說：「你知道你是一位偉大的水彩畫家嗎？」經過一連串畫作評比，拜倫將他封為繪畫界的「男爵」，並冠以「色彩之王」的頭銜，這才讓李欽泓揚眉吐氣，獲得國際肯定。
        <br><br>           
        Chinhung Lee has dedicated his life to capturing the most
        beautiful colors in the universe, with a particular fondness for
        the classic hues of Western Impressionism. He has deeply
        studied and absorbed the color techniques of Claude Monet
        and Pierre Bonnard, while also exploring the vibrant colors
        found in Eastern jade and ceramics. By applying pigments from
        various materials onto canvas, he has created stunningly rich
        and layered colors that evoke the warmth and depth of jade.
        However, his talent was once buried in a cultural desert.
        Misunderstanding his obsession with art, his family sent him to
        an asylum. Despite enduring humiliation and hardship,
        Chinhung Lee persevered on his legendary artistic journey.
        His breakthrough came when international art critic Byron
        Montgomery discovered him on Facebook and remarked, &quotYou
        are a great Watercolorist, did you know that?&quot After a series of
        artwork evaluations, Byron dubbed him the &quotBaron&quot of the art
        world and awarded him the title &quotKing of Color.&quot This
        recognition finally allowed Chinhung Lee to gain international
        acclaim and respect." position="-82 35 -69" scale="44.961 41.18735 75.113" rotation=""></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lu3.webp?v=1735003872229"
            data-text="<h3>傳承與創新<br>盧崇道賦予嶺南畫派新的生命力<br>Balancing Tradition and Innovation<br>
                   Dao Lu Infuses New Vitality into the Lingnan School of Painting</h3>
                   嶺南畫派發展於晚清時期，以顛覆傳統國畫並融合中西畫風著稱，體現了當時追求革命與創新的精神。
                   盧崇道繼承了這一創新求變的精神。1995年，他受邀赴美參加藝術交流活動後，發展出揉皺宣紙再攤平作畫的技法，開始顛覆嶺南畫派的傳統畫法，融入新的創意，增添畫作意境。
                   他的創新作品依然保留了嶺南畫派的筆觸，風格隨性自然，不講求工整，墨色深淺交織，展現氣勢磅礡與纖細婉轉的線條變化，充滿生命力，使畫作氣韻生動，並保有嶺南畫派大膽用色和細節處理的精髓。
                   在傳承與創新中，他賦予嶺南畫派新的生命力。
                   <br><br>
                   The Lingnan School of Painting, which emerged during the late Qing Dynasty, 
                   is celebrated for its subversion of traditional Chinese painting and incorporation of Western styles,
                   mirroring the era's spirit of revolution and innovation. Dao Lu embraces this spirit of change.
                   In 1995, after being invited to the United States for an art exchange event,
                   he developed a technique of wrinkling and then flattening rice paper before painting.
                   He began to disrupt traditional Lingnan School techniques, infusing new creativity and depth into his works.
                   Despite his innovations, Dao Lu retains the characteristic brushstrokes of the Lingnan School, 
                   presenting a casual and natural style that does not emphasize meticulousness. 
                   The interplay of ink shades showcases both grandeur and delicate, graceful line variations, 
                   full of vitality, making his works vibrant and dynamic. He also preserves the Lingnan School's essence of bold coloring and detailed treatment.
                   By balancing tradition and innovation, Dao Lu breathes new life into the Lingnan School of Painting."
            position="75.99578 35 -69.5" scale="47.017 50 96.834" rotation=""></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-14.webp?v=1735127921224" data-text="<h3>陋巷<br>An Alley</h3>
                   <h5>畫家：盧崇道｜編號：D2024061101-45x68｜尺寸：45x68cm｜材質：中國彩墨畫</h5>
                   旅居美國多年，2017年盧崇道應邀回到故鄉越南舉辦畫展期間所創。
                   他顛覆了嶺南畫派不露筆痕的傳統，用乾排筆沾顏料在噴濕的宣紙上作畫，乾濕結合後色彩自然變化，留下明顯筆痕。
                   作品保留了嶺南畫派的精神，用毛筆沾黑墨以中鋒或側鋒勾勒線條，畫中的天線即為嶺南畫派常見的樹枝畫法，同時融入旅美多年培養的自由風格。
                   <br><br>
                   During a return to his hometown of Vietnam in 2017 for an art exhibition, 
                   Dao Lu created this piece after many years of living in the United States. 
                   He broke from the Lingnan School's tradition of leaving no visible brushstrokes by using a dry brush dipped in paint on wet rice paper.
                   This combination of dry and wet techniques allows the colors to change naturally, leaving clear brush marks.
                   The work retains the spirit of the Lingnan School, using a brush dipped in black ink to outline lines with the tip or the side.
                   The power lines in the painting are depicted using the tree branch painting method common in the Lingnan School,
                   while also incorporating the free style he developed during his years in America."
            position="120.12379 35 -69.5" scale="28.82 31.697 90.899" rotation=""></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"
            position="197 100 -20.75886" rotation="-45 0 180"></a-entity>
        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-15.webp?v=1735127947928"
            data-text="<h3>月下雀歸巢<br>Sparrows Returning Home Under the Moonlight</h3>
                   <h5>畫家：盧崇道｜編號：D2024061102-242x122｜尺寸：242x122cm｜材質：中國彩墨畫</h5>
                   良禽擇木而棲！1995年，盧崇道受美國波士頓國際藝術協會邀請，赴美參加藝術交流活動，這次經歷激發了他尋找自己藝術語言的想法。
                   返回越南後，他揉皺宣紙再攤平作畫，創作出這幅有些地方著色、有些地方留白的獨具特色作品。
                   畫中鳥兒歡樂地棲息在大榕樹下，沈浸在溫和的月光中，享受自由與快樂。
                   這幅畫寓意著盧崇道對理想居所的渴望，那是存在心中的故鄉。這幅畫作被選入《北美華人百家書畫集》。
                   <br><br>
                   “A fine bird chooses a good tree to perch in!” 
                   In 1995, Dao Lu was invited by the Boston International Art Association to the United States for an art exchange event.
                   This experience sparked his quest for his own artistic language. Upon returning to Vietnam,
                   he developed a unique technique of wrinkling rice paper and then flattening it for painting. 
                   This piece features areas of color interspersed with blank spaces, showing birds joyfully perching in a large banyan tree, 
                   bathed in gentle moonlight, enjoying freedom and happiness. The painting symbolizes Dao Lu's longing for an ideal home, a place that exists in his heart. This artwork was included in a collection of artwork by the top 100 Chinese American calligraphers and painters in North America."
            position="195.87734 35 -69.5" scale="85.92859 29.26889 79.48748" rotation=""></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"
            position="314 100 -21.17862" rotation="-45 0 180"></a-entity>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-12.webp?v=1735127833960" data-text="<h3>潔淨<br>Purity</h3>
                   <h5>畫家：盧崇道｜編號：D2024062701-45x68｜尺寸：45x68cm｜材質：中國彩墨畫</h5>
                   畫中的荷葉與池水以嶺南畫派慣用的潑墨和潑彩技法呈現，但卻以抽象形態亮相。
                   整幅畫面中，只有出淤泥而不染的白色荷花是具象的，顯得十分潔淨，突顯了畫作的主題。
                   而點綴在荷花周圍的白點，彷彿是荷花散發的芬芳與光彩。
                   構圖獨特且充滿生機。這幅畫作是盧崇道向張大千潑墨畫致敬的創作，而他以中國彩墨描繪出西方印象派畫風的意象，更增添了賞畫的亮點，中西合璧，匠心獨具。
                   <br><br>
                   In this painting, lotus leaves and pond water are rendered using the Lingnan School's traditional ink-splash and color-splash techniques, 
                   but with an abstract twist. The only figurative element is the white lotus flower, 
                   which emerges unstained from the mud, symbolizing purity and highlighting the theme of the work. 
                   The white dots surrounding the lotus suggest its fragrance and radiance. 
                   The unique composition brims with vitality. 
                   This piece pays tribute to Zhang Daqian's ink-splash paintings, while Dao Lu employs Chinese ink and colors to evoke the imagery of Western Impressionist painting, 
                   creating an intriguing blend of Eastern and Western elements." position="283.87369 35 -69.5"
            scale="28.82 31.697 90.899" rotation=""></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-13.webp?v=1735127884013" data-text="<h3>盛夏<br>Midsummer</h3>
                   <h5>畫家：盧崇道｜編號：D2024062702-45x68｜尺寸：45x68cm｜材質：中國彩墨畫</h5>
                   這幅抽象作品展現了荷花池塘的夏日景象。
                   畫中的荷葉與池水運用了嶺南畫派的潑墨和潑彩技法，以大面積的色塊呈現。
                   荷花用紅筆勾勒，隱隱約約地露出一兩片，黃色點綴在畫面中，象徵著照耀池塘的陽光。
                   畫家在這幅畫中大膽運用了潑墨與潑彩，同時細膩地處理每個細節，加上剛中帶柔的隨性筆觸，增添了畫面的生動感。
                   這幅畫作展現了嶺南畫家深厚底蘊與不斷創新的風範。
                   <br><br> 
                   This abstract piece depicts a summer scene in a lotus pond. 
                   The lotus leaves and pond water are portrayed using the Lingnan School's ink-splash and color-splash techniques, 
                   with large swathes of color. The lotus flowers are outlined in red, with a few petals subtly visible, and yellow accents scattered throughout the painting symbolize sunlight shining on the pond.
                   Dao Lu boldly employs these techniques, meticulously handling each detail. 
                   The dynamic brushstrokes, both strong and gentle, add vibrancy to the scene. 
                   This work showcases the profound expertise of the Lingnan painter as well as his innovative spirit."
            position="343.44615 35 -69.5" scale="28.82032 31.69745 90.89912" rotation=""></a-image>

        <a-entity light="angle: 30; color: white; intensity: 0.1; penumbra: 0.3; type: spot"

        <a-image class="clickable"
            src="https://cdn.glitch.global/601c027d-141d-4c91-9464-abed6ddc9a18/1213_Lu4.webp?v=1735003916004"
            data-text="<h3>七十歲的嶺南派畫家 走進現代抽象畫裡<br>From Tradition to Modernity: 
                   Dao Lu’s Abstract Art Journey Starting at 70</h3>
                   中國有句話說：「人生七十才開始」，而盧崇道在七十歲時走進了現代抽象畫的創作世界。
                   2023年，70歲的盧崇道受到傑克遜·波洛克(Jackson Pollock)的啟發，開始探索全新的創作方式。
                   他應用嶺南畫派的水墨筆觸、潑墨、潑彩和渲染等技法，展現點、線、面的繪畫風格，並結合印象派的色彩學，創作出帶有東方寫意式的抽象畫。
                   四季系列作品具有空間感和時間感，充滿生命力，從不同角度觀賞皆能感受到獨特的美感。
                   此外，他運用了揉皺宣紙再鋪平作畫的獨特技法，使畫面更加有層次和質感，值得收藏與欣賞。
                   <br><br>
                   There is an old Chinese saying: “Life begins at seventy.” 
                   At the age of seventy, Dao Lu entered the world of modern abstract art. 
                   In 2023, inspired by Jackson Pollock, Dao Lu began exploring entirely new creative methods. 
                   He applied the Lingnan School's techniques of ink brushstrokes, ink-splash, color-splash, 
                   and shading to develop a painting style of points, lines, and planes, 
                   merging these with the color theory of Impressionism to create abstract works with Eastern freehand brushwork. 
                   This series of paintings possesses a sense of space and time, brimming with vitality, 
                   and offers a unique beauty from different viewing angles. Additionally, 
                   he employed his distinctive technique of wrinkling and then flattening rice paper before painting,
                   adding depth and texture to his works, making them worthy of collection and appreciation."
            position="393.33581 35 -37.788" scale="37.27188 38.22942 90.899" rotation="0 -90 0"></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-16.png?v=1735128093395" data-text="<h3>春<br>Spring</h3>
                   <h5>畫家：盧崇道｜編號：D2024062703-68x137｜尺寸：68x137cm｜材質：中國彩墨畫</h5>
                   這幅作品展現了越南蠟梅迎春的景象，以鮮豔的黃色為主色調，象徵著春天的到來，充滿生機和希望。
                   畫作中，枝幹和線條以嶺南畫派的筆觸描繪，黃花點點是用潑墨創造的，而彰顯畫作空間感的淡藍色和淡綠色背景則是通過渲染技法展現的。
                   整體構圖精心安排，讓人感受到畫面的深度和層次。雖是一幅抽象畫，卻能令人心領神會，黃色象徵蠟梅，藍色代表天空和空間，整體色彩鮮豔而和諧，充滿了春天的氣息。
                   <br><br>
                   This work captures the scene of Vietnamese wax plum blossoms heralding the arrival of spring. 
                   The vibrant yellow dominates the painting, symbolizing the season's vitality and hope. 
                   The branches and lines are rendered with the Lingnan School's brushstrokes, 
                   while the yellow flowers are brought to life using ink-splash techniques. 
                   A light blue and green background enhances the sense of space through shading techniques. 
                   The composition is meticulously arranged, creating a sense of depth and layering. 
                   Though abstract, the painting clearly conveys the imagery: 
                   yellow representing the wax plum blossoms and blue symbolizing the sky and space. 
                   The overall colors are bright and harmonious, imbued with the essence of spring."
            position="397.5 35 -8.96438" scale="15.079 33.68 90.899" rotation="0 -90 0"></a-image>

        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-17.png?v=1735128128268" data-text="<h3>夏<br>Summer</h3>
                   <h5>畫家：盧崇道｜編號：D2024062704-68x137｜尺寸：68x137cm｜材質：中國彩墨畫</h5>
                   這幅抽象畫作靈感來自夏日柳葉隨風搖曳的景象，觀者可從中感受到柳葉隨風飄揚的動感和微風輕拂的清涼。
                   畫家為此費盡巧思，先用筆墨勾勒主軸和構圖，再用白色線條描繪風的流動，用墨描繪搖曳的柳枝，最後以不同的綠色逐層渲染，細膩地表現柳葉的飄動，展現自然的韻律與輕盈之美。
                   值得一提的是，他運用了獨特的渲染技法，有時甚至在宣紙背面進行渲染，以避免畫面變得雜亂，這種創新手法賦予畫作更立體和深邃的效果。
                   <br><br>
                   Inspired by the scene of willow leaves swaying in the summer breeze, 
                   this abstract painting captures the dynamic motion of the leaves and the coolness of the gentle wind. 
                   The artist meticulously outlined the main structure and composition with brush and ink, 
                   using white lines to depict the wind's flow and ink to portray the swaying willow branches. 
                   Layers of different shades of green delicately express the leaves' movement, 
                   showcasing nature's rhythm and lightness. The artist employed unique shading techniques, 
                   sometimes even shading the back of the rice paper to avoid cluttering the image. 
                   This innovative method adds a three-dimensional and profound effect to the painting."
            position="397.5 35 12.20117" scale="15.079 33.68 90.899" rotation="0 -90 0"></a-image>
        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-18.png?v=1735128145972" data-text="<h3>秋<br>Autumn</h3>
                   <h5>畫家：盧崇道｜編號：D2024062705-68x137｜尺寸：68x137cm｜材質：中國彩墨畫</h5>
                   這幅畫作大量使用潑墨和潑彩技法，畫家以黃、橙色展現秋天的色調，層次豐富，色彩堆疊細膩，生動地描繪了楓葉變黃、植物枯黃的秋日景象。
                   白色線條描繪的野草，不僅提亮了畫面，還增添了獨特的視覺效果。層層堆疊的色彩是一筆一筆描繪上去的，每個細節都顯得精緻且耐人尋味，完美展現了嶺南畫派的精髓。
                   <br><br>
                   This painting extensively uses ink-splash and color-splash techniques. 
                   The artist employs yellow and orange tones to capture the essence of autumn, 
                   with rich layers and delicate color stacking that vividly depicts the yellowing maple leaves and withering plants of autumn. 
                   White lines represent wild grass, not only brightening the painting but also adding a unique visual effect. 
                   The layers of colors are meticulously applied, with each detail appearing exquisite and intriguing, 
                   perfectly embodying the spirit of the Lingnan School." position="397.5 35 34.34143"
            scale="15.079 33.68 90.899" rotation="0 -90 0"></a-image>
        <a-image class="clickable"
            src="https://cdn.glitch.global/51ca5968-dc38-468b-92a0-2c936d6db35f/lifu-19.png?v=1735128172423" data-text="<h3>冬<br>Winter</h3>
                   <h5>畫家：盧崇道｜編號：D2024062706-68x137｜尺寸：68x137cm｜材質：中國彩墨畫</h5>
                   這幅畫作抽象地傳遞了冬日的孤寂與風雪紛飛落在枯樹上的意象。
                   畫家特別著重用筆技巧，在樹的線條中展現出剛柔並濟的嶺南筆觸，使樹木顯得強壯而富有生命力，這是底蘊深厚的大師才能駕馭的畫作。
                   雪花通過留白和白粉點綴，營造出雪花飄落在樹枝上的效果。灰色調的點和潑墨技法增強了畫面的層次感與深度。
                   整幅畫面由點、線、面組成，色彩層次豐富，細節處理精緻。
                   此作品是春、夏、秋、冬系列中的一幅，整個系列如同四季交替，韻味無窮，值得珍藏。
                   <br><br>
                   This piece abstractly conveys the solitude of winter and the imagery of snow falling on barren trees. 
                   The artist skillfully uses brush techniques, showcasing robust yet gentle Lingnan brushstrokes to depict tree lines, 
                   making the trees appear strong and full of vitality—a masterful work achievable only by an artist with profound skill. 
                   Snowflakes are represented through blank spaces and white powder accents, 
                   effectively creating the illusion of snow resting on branches. 
                   Gray tones and ink-splash techniques enhance the painting's depth and layering. 
                   The entire composition is constructed with points, lines, and planes, 
                   featuring rich color layers and meticulous detail.
                   This painting is part of a series representing the four seasons: Spring, Summer, Autumn, and Winter. 
                   The entire series, like the changing seasons, is full of charm and is highly collectible."
            position="397.5 35 54.976" scale="15.079 33.68 90.899" rotation="0 -90 0"></a-image>
